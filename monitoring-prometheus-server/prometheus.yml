global: { scrape_interval: 15s }
scrape_configs:
  - job_name: 'node'
    static_configs: [{ targets: ['monitoring-node-exporter-server:9100'] } ]

# Phần mở rộng
  - job_name: 'web'
    # Thêm dòng này để bảo nó kiểm tra trang chủ thay vì /metrics
    metrics_path: /metrics.txt
    static_configs:
      - targets: ['web-frontend-server:80']
