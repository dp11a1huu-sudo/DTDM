networks: { cloud-net: { name: cloud-net } }
services:
  web-frontend-server:
    build: ./web-frontend-server
    image: tronghuu128/web:dev
    container_name: web-frontend-server
    networks: [cloud-net]
    ports:
      - "8080:80"
    restart: unless-stopped

  # Phần mở rộng: Web server thứ 2 cho Load Balancing (Round Robin)
  web-frontend-server-2:
    build: ./web-frontend-server
    image: tronghuu128/web:dev
    container_name: web-frontend-server-2
    networks: [cloud-net]
    volumes:
      # Dung chung noi dung day du (blog + anh) voi server 1
      - ./web-frontend-server/html:/usr/share/nginx/html:ro
      # Chi ghi de index.html de phan biet "Web Server 2" khi demo Load Balancing
      - ./web-frontend-server/html2/index.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped

  application-backend-server:
    build: ./application-backend-server
    image: tronghuu128/app:dev
    container_name: application-backend-server
    networks: [cloud-net]
    ports: ["8085:8081"]
    environment:
      OIDC_ISSUER: "http://authentication-identity-server:8080/realms/realm_sv110"
      OIDC_ISSUER_EXPECTED: "${OIDC_ISSUER_EXPECTED:-http://localhost:8081/realms/realm_sv110}"
      OIDC_AUDIENCE: "account"
    restart: unless-stopped

  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
    ports: ["3306:3306"]
    networks: [cloud-net]
    restart: unless-stopped

  authentication-identity-server:
    image: quay.io/keycloak/keycloak:latest
    container_name: authentication-identity-server
    command: ["start-dev", "--import-realm", "--spi-login-protocol--openid-connect--allow-oidc-params-in-redirect-uris=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "${KC_HOSTNAME:-localhost}"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
    volumes:
      - ./authentication-identity-server/realm_sv110.json:/opt/keycloak/data/import/realm_sv110.json:ro
    ports: ["8081:8080"]
    restart: unless-stopped
    networks: [cloud-net]

  object-storage-server:
    image: ghcr.io/coollabsio/minio:latest
    container_name: object-storage-server
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./object-storage-server/data:/data
    ports: ["9000:9000", "9001:9001"]
    networks: [cloud-net]
    restart: unless-stopped

  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    command: ["-g", "-4"]
    ports:
      - "1053:53/udp"
    volumes:
      - ./internal-dns-server/named.conf.options:/etc/bind/named.conf.options:ro
      - ./internal-dns-server/named.conf.local:/etc/bind/named.conf.local:ro
      - ./internal-dns-server/db.cloud.local:/etc/bind/db.cloud.local:ro  
      - ./internal-dns-server/named.conf:/etc/bind/named.conf:ro
    networks:
      - cloud-net
    restart: unless-stopped

  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    ports: ["9100:9100"]
    networks: [cloud-net]
    restart: unless-stopped

  monitoring-prometheus-server:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus-server
    ports: ["9090:9090"]
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [cloud-net]
    restart: unless-stopped

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    ports: ["3000:3000"]
    networks: [cloud-net]
    restart: unless-stopped

  api-gateway-proxy-server:
    image: nginx:stable
    container_name: api-gateway-proxy-server
    depends_on:
      - web-frontend-server
      - application-backend-server
      - authentication-identity-server
    ports: ["80:80"]
    volumes:
      - ./api-gateway-proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [cloud-net]
    restart: unless-stopped
